<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- ===== OUTER CONTAINER ===== -->
  <rect x="20" y="20" width="960" height="660" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="500" y="45" fill="white" font-size="13" font-weight="700" text-anchor="middle">SPRACHSPIEL UNIFIED ARCHITECTURE</text>

  <!-- ===== TIER 3: PARAMETER (Future) ===== -->
  <rect x="50" y="65" width="430" height="140" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="50" y="65" width="430" height="140" rx="6" fill="rgba(120, 53, 15, 0.2)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="265" y="90" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">TIER 3: PARAMETER (Future: LoRA)</text>
  <text x="265" y="110" fill="#94a3b8" font-size="9" text-anchor="middle">↑ OFFLINE BATCH</text>
  <text x="80" y="135" fill="white" font-size="9">Skill adapters</text>
  <text x="80" y="155" fill="white" font-size="9">User embeddings</text>
  <text x="80" y="175" fill="white" font-size="9">Long-term preferences</text>

  <!-- ===== TIER 2: ACTIVATION (Future) ===== -->
  <rect x="520" y="65" width="430" height="140" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="520" y="65" width="430" height="140" rx="6" fill="rgba(120, 53, 15, 0.2)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="735" y="90" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">TIER 2: ACTIVATION (Future)</text>
  <text x="735" y="110" fill="#94a3b8" font-size="9" text-anchor="middle">↑ ONLINE LEARNING</text>
  <text x="550" y="135" fill="white" font-size="9">KV-Cache / Adapters</text>
  <text x="550" y="155" fill="white" font-size="9">Session-level patterns</text>
  <text x="550" y="175" fill="white" font-size="9">Working memory / Context compression</text>

  <!-- ===== TIER 1: PLAINTEXT (Current) ===== -->
  <rect x="50" y="225" width="900" height="200" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="50" y="225" width="900" height="200" rx="6" fill="rgba(6, 78, 59, 0.2)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="250" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">TIER 1: PLAINTEXT (Current)</text>

  <!-- Working Context -->
  <rect x="80" y="265" width="270" height="140" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="80" y="265" width="270" height="140" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="215" y="290" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">WORKING CONTEXT</text>
  <text x="100" y="315" fill="white" font-size="9">Recent messages</text>
  <text x="100" y="335" fill="white" font-size="9">Retrieved context</text>
  <text x="100" y="355" fill="white" font-size="9">Decays over time</text>
  <text x="100" y="385" fill="#94a3b8" font-size="8">↑ Session-level</text>

  <!-- Episodic -->
  <rect x="370" y="265" width="270" height="140" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="370" y="265" width="270" height="140" rx="6" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="505" y="290" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">EPISODIC (Chat DB)</text>
  <text x="390" y="315" fill="white" font-size="9">Messages</text>
  <text x="390" y="335" fill="white" font-size="9">Embeddings</text>
  <text x="390" y="355" fill="white" font-size="9">Feedback signals</text>
  <text x="390" y="385" fill="#94a3b8" font-size="8">↑ Weighted by feedback</text>

  <!-- Factual -->
  <rect x="660" y="265" width="270" height="140" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="660" y="265" width="270" height="140" rx="6" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="795" y="290" fill="#22c55e" font-size="10" font-weight="600" text-anchor="middle">FACTUAL (AGENTS.md/SOUL)</text>
  <text x="680" y="315" fill="white" font-size="9">Project context</text>
  <text x="680" y="335" fill="white" font-size="9">Personality</text>
  <text x="680" y="355" fill="white" font-size="9">Skills loaded</text>
  <text x="680" y="385" fill="#94a3b8" font-size="8">↑ Static</text>

  <!-- ===== LEARNING SIGNAL PIPELINE ===== -->
  <rect x="50" y="445" width="900" height="210" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="50" y="445" width="900" height="210" rx="6" fill="rgba(120, 53, 15, 0.15)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="500" y="470" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">LEARNING SIGNAL PIPELINE</text>

  <text x="500" y="495" fill="white" font-size="9" text-anchor="middle">User Interaction → Signal Capture → Weight Application</text>

  <!-- Explicit -->
  <rect x="100" y="510" width="230" height="120" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="100" y="510" width="230" height="120" rx="6" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="215" y="535" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">Explicit</text>
  <text x="215" y="558" fill="white" font-size="9" text-anchor="middle">/feedback good/bad</text>
  <text x="215" y="578" fill="white" font-size="9" text-anchor="middle">/feedback correction</text>
  <text x="215" y="610" fill="#94a3b8" font-size="8" text-anchor="middle">Evaluative + Directive</text>

  <!-- Implicit -->
  <rect x="385" y="510" width="230" height="120" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="385" y="510" width="230" height="120" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="500" y="535" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">Implicit</text>
  <text x="500" y="558" fill="white" font-size="9" text-anchor="middle">Continue / Abandon</text>
  <text x="500" y="578" fill="white" font-size="9" text-anchor="middle">Re-query / Repeat</text>
  <text x="500" y="610" fill="#94a3b8" font-size="8" text-anchor="middle">Behavioral patterns</text>

  <!-- SQLite Update -->
  <rect x="670" y="510" width="230" height="120" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="670" y="510" width="230" height="120" rx="6" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="785" y="535" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">SQLite Update</text>
  <text x="785" y="558" fill="white" font-size="9" text-anchor="middle">Weight adjustment</text>
  <text x="785" y="578" fill="white" font-size="9" text-anchor="middle">Decay recalculation</text>
  <text x="785" y="610" fill="#94a3b8" font-size="8" text-anchor="middle">RRF fusion boost</text>

  <!-- Arrows between pipeline stages -->
  <line x1="330" y1="570" x2="385" y2="570" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="615" y1="570" x2="670" y2="570" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ===== LEGEND ===== -->
  <text x="50" y="685" fill="white" font-size="10" font-weight="600">Legend</text>
  <rect x="110" y="676" width="14" height="9" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="130" y="685" fill="#94a3b8" font-size="7">Future tier</text>
  <rect x="210" y="676" width="14" height="9" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="230" y="685" fill="#94a3b8" font-size="7">Current (plaintext)</text>
  <rect x="340" y="676" width="14" height="9" rx="2" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="360" y="685" fill="#94a3b8" font-size="7">Explicit signal</text>
  <rect x="440" y="676" width="14" height="9" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="460" y="685" fill="#94a3b8" font-size="7">Implicit signal</text>
  <rect x="540" y="676" width="14" height="9" rx="2" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="560" y="685" fill="#94a3b8" font-size="7">Storage update</text>
</svg>