<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1880">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee" />
          </marker>
          <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
          </marker>
          <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa" />
          </marker>
          <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
          </marker>
          <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- ===== STAGE 1: USER INPUT ===== -->
        <rect x="430" y="20" width="240" height="55" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="430" y="20" width="240" height="55" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="550" y="44" fill="white" font-size="12" font-weight="600" text-anchor="middle">USER INPUT</text>
        <text x="550" y="60" fill="#94a3b8" font-size="9" text-anchor="middle">chat · note · import · quiz</text>

        <!-- Arrow 1→2 -->
        <line x1="550" y1="75" x2="550" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- ===== STAGE 2: INGESTION PIPELINE ===== -->
        <rect x="40" y="110" width="1020" height="260" rx="8" fill="rgba(6, 78, 59, 0.08)" stroke="#34d399" stroke-width="1" stroke-dasharray="6,3"/>
        <text x="60" y="130" fill="#34d399" font-size="10" font-weight="600">INGESTION PIPELINE</text>

        <!-- Row 1: Chunker → Embedder → Indexer -->
        <rect x="100" y="145" width="240" height="60" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="100" y="145" width="240" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="220" y="170" fill="white" font-size="11" font-weight="600" text-anchor="middle">Chunker</text>
        <text x="220" y="190" fill="#94a3b8" font-size="9" text-anchor="middle">split by content type</text>

        <line x1="340" y1="175" x2="380" y2="175" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

        <rect x="390" y="145" width="240" height="60" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="390" y="145" width="240" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="510" y="170" fill="white" font-size="11" font-weight="600" text-anchor="middle">Embedder</text>
        <text x="510" y="190" fill="#94a3b8" font-size="9" text-anchor="middle">Ollama nomic</text>

        <line x1="630" y1="175" x2="670" y2="175" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

        <rect x="680" y="145" width="240" height="60" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="680" y="145" width="240" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="800" y="170" fill="white" font-size="11" font-weight="600" text-anchor="middle">Indexer</text>
        <text x="800" y="190" fill="#94a3b8" font-size="9" text-anchor="middle">sqlite-vec + FTS5</text>

        <!-- Row 2: Fact Extractor → Importance Scorer → Decay Calculator -->
        <rect x="100" y="240" width="240" height="60" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="100" y="240" width="240" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="220" y="264" fill="white" font-size="11" font-weight="600" text-anchor="middle">Fact Extractor</text>
        <text x="220" y="284" fill="#94a3b8" font-size="9" text-anchor="middle">heuristic triples</text>

        <line x1="340" y1="270" x2="380" y2="270" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

        <rect x="390" y="240" width="240" height="60" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="390" y="240" width="240" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="510" y="264" fill="white" font-size="11" font-weight="600" text-anchor="middle">Importance Scorer</text>
        <text x="510" y="284" fill="#94a3b8" font-size="9" text-anchor="middle">feedback + type</text>

        <line x1="630" y1="270" x2="670" y2="270" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

        <rect x="680" y="240" width="240" height="60" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="680" y="240" width="240" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="800" y="264" fill="white" font-size="11" font-weight="600" text-anchor="middle">Decay Calculator</text>
        <text x="800" y="284" fill="#94a3b8" font-size="9" text-anchor="middle">Ebbinghaus 2^(-t/h)</text>

        <!-- Arrow 2→3 -->
        <line x1="550" y1="370" x2="550" y2="400" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

        <!-- ===== STAGE 3: CONTENT ITEMS (Unified Schema) ===== -->
        <rect x="100" y="410" width="900" height="180" rx="8" fill="#0f172a" stroke="none"/>
        <rect x="100" y="410" width="900" height="180" rx="8" fill="rgba(76, 29, 149, 0.2)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="120" y="435" fill="#a78bfa" font-size="11" font-weight="600">CONTENT_ITEMS — Unified Schema (v12)</text>

        <text x="140" y="465" fill="white" font-size="9">content_type: message | note | document (| study TBD)</text>
        <text x="140" y="485" fill="#94a3b8" font-size="9">importance, decay_score, access_count, has_embedding</text>
        <text x="140" y="505" fill="#94a3b8" font-size="9">feedback_signals (good/bad/correction, per item)</text>
        <text x="140" y="525" fill="#94a3b8" font-size="9">chunk_embeddings (vec0, 256d Matryoshka)</text>
        <text x="140" y="545" fill="#94a3b8" font-size="9">content_fts (FTS5 BM25)</text>
        <text x="140" y="570" fill="#a78bfa" font-size="8">SQLite · schema v12 · distance_metric=cosine</text>

        <!-- Arrow 3→4 -->
        <line x1="550" y1="590" x2="550" y2="620" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

        <!-- ===== STAGE 4: RETRIEVAL PIPELINE ===== -->
        <rect x="40" y="630" width="1020" height="300" rx="8" fill="rgba(6, 78, 59, 0.08)" stroke="#34d399" stroke-width="1" stroke-dasharray="6,3"/>
        <text x="60" y="650" fill="#34d399" font-size="10" font-weight="600">RETRIEVAL PIPELINE</text>

        <!-- Main retrieval flow -->
        <rect x="100" y="670" width="140" height="40" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="100" y="670" width="140" height="40" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="170" y="694" fill="white" font-size="10" font-weight="600" text-anchor="middle">Query</text>

        <line x1="240" y1="690" x2="280" y2="690" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

        <rect x="290" y="670" width="140" height="40" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="290" y="670" width="140" height="40" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="360" y="694" fill="white" font-size="10" font-weight="600" text-anchor="middle">Embed</text>

        <line x1="430" y1="690" x2="470" y2="690" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

        <rect x="480" y="670" width="180" height="40" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="480" y="670" width="180" height="40" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="570" y="694" fill="white" font-size="10" font-weight="600" text-anchor="middle">Hybrid Search</text>

        <line x1="660" y1="690" x2="700" y2="690" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

        <rect x="710" y="670" width="160" height="40" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="710" y="670" width="160" height="40" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="790" y="694" fill="white" font-size="10" font-weight="600" text-anchor="middle">Re-ranking</text>

        <!-- Feedback Weighting branch -->
        <rect x="480" y="740" width="180" height="50" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="480" y="740" width="180" height="50" rx="6" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="570" y="762" fill="white" font-size="9" font-weight="600" text-anchor="middle">Feedback Weighting</text>
        <text x="570" y="778" fill="#94a3b8" font-size="8" text-anchor="middle">good boost, bad suppress</text>
        <line x1="480" y1="710" x2="480" y2="750" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="570" y1="765" x2="790" y2="710" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>

        <!-- Decay Factor branch -->
        <rect x="710" y="740" width="200" height="70" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="710" y="740" width="200" height="70" rx="6" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="810" y="762" fill="white" font-size="9" font-weight="600" text-anchor="middle">Decay Factor</text>
        <text x="810" y="778" fill="#94a3b8" font-size="8" text-anchor="middle">2^(-t/half_life)</text>
        <text x="810" y="793" fill="#94a3b8" font-size="7" text-anchor="middle">per content type</text>
        <line x1="790" y1="740" x2="810" y2="710" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- RRF fusion note -->
        <rect x="290" y="780" width="180" height="50" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="#1e293b" stroke-width="1"/>
        <text x="380" y="800" fill="#94a3b8" font-size="8" text-anchor="middle">Hybrid RRF Fusion</text>
        <text x="380" y="815" fill="#64748b" font-size="7" text-anchor="middle">vec0 cosine(0.6) + FTS5(0.4)</text>

        <!-- Arrow 4→5 -->
        <line x1="550" y1="930" x2="550" y2="960" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

        <!-- ===== STAGE 5: CONTEXT BUILDER ===== -->
        <rect x="100" y="970" width="900" height="250" rx="8" fill="#0f172a" stroke="none"/>
        <rect x="100" y="970" width="900" height="250" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="120" y="995" fill="#22d3ee" font-size="11" font-weight="600">CONTEXT BUILDER</text>

        <text x="140" y="1025" fill="white" font-size="9" font-weight="500">1. System Prompt</text>
        <text x="320" y="1025" fill="#94a3b8" font-size="8">AGENTS.md + SOUL.md</text>
        <text x="140" y="1048" fill="white" font-size="9" font-weight="500">2. System Reminders</text>
        <text x="320" y="1048" fill="#94a3b8" font-size="8">conditional injection</text>
        <text x="140" y="1071" fill="white" font-size="9" font-weight="500">3. User Facts</text>
        <text x="320" y="1071" fill="#94a3b8" font-size="8">preferences + facts, up to 2200 chars</text>
        <text x="140" y="1094" fill="white" font-size="9" font-weight="500">4. Retrieved Context</text>
        <text x="320" y="1094" fill="#94a3b8" font-size="8">hybrid search, top-K relevant</text>
        <text x="140" y="1117" fill="white" font-size="9" font-weight="500">5. Recent Messages</text>
        <text x="320" y="1117" fill="#94a3b8" font-size="8">last N messages</text>
        <text x="140" y="1140" fill="white" font-size="9" font-weight="500">6. Study Context</text>
        <text x="320" y="1140" fill="#fb7185" font-size="8">if in session — TBD B3</text>
        <text x="140" y="1163" fill="white" font-size="9" font-weight="500">7. Current Query</text>
        <text x="320" y="1163" fill="#94a3b8" font-size="8">user input for this turn</text>

        <!-- Layer indicators -->
        <text x="880" y="1025" fill="#1e293b" font-size="36" text-anchor="end" font-weight="700">7</text>
        <text x="920" y="1025" fill="#1e293b" font-size="9" text-anchor="end">layers</text>

        <!-- Arrow 5→6 -->
        <line x1="550" y1="1220" x2="550" y2="1250" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

        <!-- ===== STAGE 6: VERIFICATION LAYER ===== -->
        <rect x="100" y="1260" width="900" height="200" rx="8" fill="rgba(136, 19, 55, 0.06)" stroke="#fb7185" stroke-width="1" stroke-dasharray="6,3"/>
        <text x="120" y="1285" fill="#fb7185" font-size="10" font-weight="600">VERIFICATION LAYER — TBD B3</text>

        <!-- 2x2 grid of verifiers -->
        <rect x="140" y="1300" width="180" height="60" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="140" y="1300" width="180" height="60" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="230" y="1325" fill="white" font-size="10" font-weight="600" text-anchor="middle">Code Verifier</text>
        <text x="230" y="1343" fill="#94a3b8" font-size="8" text-anchor="middle">sandbox + tests</text>

        <rect x="360" y="1300" width="180" height="60" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="360" y="1300" width="180" height="60" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="450" y="1325" fill="white" font-size="10" font-weight="600" text-anchor="middle">Text Verifier</text>
        <text x="450" y="1343" fill="#94a3b8" font-size="8" text-anchor="middle">cross-model</text>

        <rect x="580" y="1300" width="180" height="60" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="580" y="1300" width="180" height="60" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="670" y="1325" fill="white" font-size="10" font-weight="600" text-anchor="middle">Study Verifier</text>
        <text x="670" y="1343" fill="#94a3b8" font-size="8" text-anchor="middle">quiz / check</text>

        <rect x="800" y="1300" width="180" height="60" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="800" y="1300" width="180" height="60" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="890" y="1325" fill="white" font-size="10" font-weight="600" text-anchor="middle">Schema Verifier</text>
        <text x="890" y="1343" fill="#94a3b8" font-size="8" text-anchor="middle">structured output</text>

        <!-- Output -->
        <text x="550" y="1395" fill="white" font-size="9" font-weight="500" text-anchor="middle">Output: verified_response + confidence_score</text>

        <!-- Arrow 6→7 -->
        <line x1="550" y1="1460" x2="550" y2="1490" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

        <!-- ===== STAGE 7: FEEDBACK LOOP ===== -->
        <rect x="100" y="1500" width="900" height="190" rx="8" fill="rgba(120, 53, 15, 0.08)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,3"/>
        <text x="120" y="1525" fill="#fbbf24" font-size="10" font-weight="600">FEEDBACK LOOP</text>

        <rect x="140" y="1540" width="280" height="50" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="140" y="1540" width="280" height="50" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="280" y="1562" fill="white" font-size="10" font-weight="600" text-anchor="middle">/feedback good/bad/correction</text>
        <text x="280" y="1578" fill="#94a3b8" font-size="8" text-anchor="middle">update importance · update decay speed</text>

        <rect x="500" y="1540" width="280" height="50" rx="6" fill="#0f172a" stroke="none"/>
        <rect x="500" y="1540" width="280" height="50" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="640" y="1562" fill="white" font-size="10" font-weight="600" text-anchor="middle">Every retrieval: on_content_access()</text>
        <text x="640" y="1578" fill="#94a3b8" font-size="8" text-anchor="middle">access_count += 1 · importance += 0.001</text>

        <!-- Feedback loop arrow back to ingestion -->
        <path d="M 550 1690 L 550 1720 Q 550 1740 530 1740 L 30 1740 Q 10 1740 10 1720 L 10 200 Q 10 175 30 175 L 90 175" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
        <text x="20" y="910" fill="#fbbf24" font-size="8" transform="rotate(-90, 20, 910)">feedback reinforces entire pipeline</text>

        <!-- ===== LEGEND ===== -->
        <text x="820" y="1800" fill="white" font-size="10" font-weight="600">Legend</text>
        <rect x="820" y="1812" width="14" height="9" rx="2" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
        <text x="840" y="1820" fill="#94a3b8" font-size="7">Entry Point</text>
        <rect x="820" y="1827" width="14" height="9" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
        <text x="840" y="1835" fill="#94a3b8" font-size="7">Processing</text>
        <rect x="820" y="1842" width="14" height="9" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
        <text x="840" y="1850" fill="#94a3b8" font-size="7">Storage</text>
        <rect x="920" y="1812" width="14" height="9" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
        <text x="940" y="1820" fill="#94a3b8" font-size="7">Context</text>
        <rect x="920" y="1827" width="14" height="9" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
        <text x="940" y="1835" fill="#94a3b8" font-size="7">Verification</text>
        <rect x="920" y="1842" width="14" height="9" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
        <text x="940" y="1850" fill="#94a3b8" font-size="7">Feedback</text>

        <!-- Stage numbers on left -->
        <text x="30" y="50" fill="#1e293b" font-size="28" font-weight="700">1</text>
        <text x="30" y="240" fill="#1e293b" font-size="28" font-weight="700">2</text>
        <text x="30" y="500" fill="#1e293b" font-size="28" font-weight="700">3</text>
        <text x="30" y="780" fill="#1e293b" font-size="28" font-weight="700">4</text>
        <text x="30" y="1095" fill="#1e293b" font-size="28" font-weight="700">5</text>
        <text x="30" y="1360" fill="#1e293b" font-size="28" font-weight="700">6</text>
        <text x="30" y="1595" fill="#1e293b" font-size="28" font-weight="700">7</text>
      </svg>