<!-- Background -->
<rect width="100%" height="100%" fill="#020617"/>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
</pattern>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<circle cx="30" cy="28" r="6" fill="#a78bfa"/>
<text x="45" y="34" fill="#f0f6fc" font-size="18" font-weight="700">Source Types &amp; Storage</text>
<text x="45" y="52" fill="#94a3b8" font-size="12">Content_Items Table — Schema v12 (as implemented)</text>

<!-- ===== CONTENT ITEMS BOUNDARY ===== -->
<rect x="30" y="70" width="1040" height="440" rx="12" fill="rgba(88,166,255,0.04)" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="8,4"/>
<text x="50" y="90" fill="#58a6ff" font-size="11" font-weight="600">CONTENT_ITEMS TABLE — Schema v12</text>

<!-- MESSAGE card -->
