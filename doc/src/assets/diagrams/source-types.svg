<text x="710" y="232" fill="#e6edf3" font-size="8.5">has_embedding</text>
<rect x="703" y="238" width="170" height="30" rx="4" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="0.5" stroke-dasharray="3,2"/>
<text x="788" y="257" fill="#a78bfa" font-size="7" text-anchor="middle">pref=180d / reg=30d</text>

<!-- STUDY (TBD) card -->
<rect x="900" y="105" width="155" height="180" rx="6" fill="#0f172a" stroke="none"/>
