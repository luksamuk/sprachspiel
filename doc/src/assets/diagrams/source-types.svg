<text x="578" y="257" fill="#fbbf24" font-size="7" text-anchor="middle">90d → 120d actual</text>

<!-- FACT card -->
<rect x="695" y="105" width="185" height="180" rx="6" fill="#0f172a" stroke="none"/>
