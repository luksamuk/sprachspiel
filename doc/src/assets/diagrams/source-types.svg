<text x="485" y="515" fill="#94a3b8" font-size="8">for long items</text>
<text x="485" y="530" fill="#94a3b8" font-size="8">v7 schema</text>

<!-- content_fts -->
<rect x="680" y="460" width="190" height="100" rx="6" fill="rgba(15,23,42,0.8)" stroke="#1e293b" stroke-width="1"/>
