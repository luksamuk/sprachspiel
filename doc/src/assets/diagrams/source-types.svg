<text x="695" y="515" fill="#94a3b8" font-size="8">full-text search</text>
<text x="695" y="530" fill="#94a3b8" font-size="8">v7 schema</text>

<!-- fact_embeddings -->
<rect x="890" y="460" width="165" height="100" rx="6" fill="rgba(15,23,42,0.8)" stroke="#1e293b" stroke-width="1"/>
<rect x="890" y="460" width="165" height="24" rx="6" fill="rgba(76,29,149,0.2)"/>
<text x="973" y="477" fill="#a78bfa" font-size="9" font-weight="600" text-anchor="middle">fact_embeddings</text>
<text x="905" y="500" fill="#94a3b8" font-size="8">vec0 virtual table</text>
<text x="905" y="515" fill="#94a3b8" font-size="8">256d, facts only</text>
<text x="905" y="530" fill="#94a3b8" font-size="8">v12 schema</text>

