<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="100%">
<style>
  text { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
