<text x="915" y="197" fill="#94a3b8" font-size="8.5">importance=0.9</text>
<text x="915" y="212" fill="#94a3b8" font-size="8.5">half_life=180d</text>
<rect x="908" y="228" width="140" height="30" rx="4" fill="rgba(251,113,133,0.1)" stroke="#fb7185" stroke-width="0.5" stroke-dasharray="3,2"/>
<text x="978" y="247" fill="#fb7185" font-size="7" text-anchor="middle">NOT YET IN SCHEMA</text>

<!-- ===== SHARED COLUMNS ===== -->
<rect x="50" y="310" width="1005" height="80" rx="6" fill="rgba(15,23,42,0.8)" stroke="#1e293b" stroke-width="1"/>
<text x="70" y="333" fill="#94a3b8" font-size="10" font-weight="600">SHARED COLUMNS</text>
<text x="70" y="355" fill="#e6edf3" font-size="8.5">importance REAL DEFAULT 0.5</text>
<text x="70" y="370" fill="#94a3b8" font-size="7.5">(feedback adjusts ±0.05/0.1)</text>
<text x="340" y="355" fill="#e6edf3" font-size="8.5">decay_score REAL DEFAULT 1.0</text>
<text x="340" y="370" fill="#94a3b8" font-size="7.5">(Ebbinghaus 2^(-t/h))</text>
<text x="600" y="355" fill="#e6edf3" font-size="8.5">access_count INTEGER DEFAULT 0</text>
<text x="600" y="370" fill="#94a3b8" font-size="7.5">(reinforces retention)</text>
<text x="825" y="355" fill="#e6edf3" font-size="8.5">last_accessed INTEGER</text>
<text x="825" y="370" fill="#94a3b8" font-size="7.5">(updated on retrieval)</text>
<text x="70" y="383" fill="#e6edf3" font-size="8.5">has_embedding INTEGER DEFAULT 0</text>

<!-- ===== SEPARATE TABLES ===== -->
<rect x="30" y="420" width="1040" height="160" rx="12" fill="rgba(15,23,42,0.4)" stroke="#30363d" stroke-width="1"/>
<text x="50" y="445" fill="#94a3b8" font-size="10" font-weight="600">SEPARATE TABLES</text>

