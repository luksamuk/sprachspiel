<text x="275" y="515" fill="#94a3b8" font-size="8">256d Matryoshka</text>
<text x="275" y="530" fill="#94a3b8" font-size="8">distance_metric=cosine</text>

<!-- content_chunks -->
<rect x="470" y="460" width="190" height="100" rx="6" fill="rgba(15,23,42,0.8)" stroke="#1e293b" stroke-width="1"/>
<rect x="470" y="460" width="190" height="24" rx="6" fill="rgba(6,78,59,0.2)"/>
