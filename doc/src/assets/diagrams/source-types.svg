<text x="65" y="217" fill="#e6edf3" font-size="8.5">prompt_tokens</text>
<rect x="58" y="228" width="180" height="30" rx="4" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" stroke-width="0.5" stroke-dasharray="3,2"/>
