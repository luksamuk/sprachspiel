[package]
name = "ask-ollama"
version = "0.9.0"
edition = "2024"

[features]
default = ["weather-tools", "file-tools", "pokemon-tools"]
all-tools = ["pokemon-tools", "weather-tools", "web-search-tools", "file-tools"]
pokemon-tools = []
weather-tools = []
web-search-tools = []
file-tools = []

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
dirs = "5.0"
futures = "0.3.31"
indicatif = "0.17"
ollama-rs = { version = "0.3.4", features = ["headers", "macros", "stream", "tokio", "tool-implementations"] }
reqwest = { version = "0.13.2", features = ["json"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
termimad = "0.34"
tokio = "1.49.0"
toml = "0.8"
urlencoding = "2.1"
walkdir = "2.5"
