[package]
name = "sprachspiel"
version = "0.44.0"
edition = "2024"

# Binary name is "sprach" (short CLI command).
# Crate/lib name stays "sprachspiel" (for module paths: sprachspiel::tokens etc).
[[bin]]
name = "sprach"
path = "src/main.rs"

[workspace]
members = [".", "sprachspiel-tool-derive"]

[features]
default = ["weather-tools", "file-tools", "calc-tools", "system-tools", "skills-tools", "document-tools", "subagent-tools", "mermaid", "latex"]
all-tools = ["pokemon-tools", "weather-tools", "search-tools", "file-tools", "calc-tools", "finance-tools", "system-tools", "led-tools", "skills-tools", "document-tools", "subagent-tools", "mermaid", "latex", "sandbox"]
all-tools-no-sandbox = ["pokemon-tools", "weather-tools", "search-tools", "file-tools", "calc-tools", "finance-tools", "system-tools", "led-tools", "skills-tools", "document-tools", "subagent-tools", "mermaid", "latex"]
pokemon-tools = []
weather-tools = []
# html2md is also in ollama-rs, but we need direct access for search_builtin
# scraper is used to clean HTML before converting to markdown
search-tools = ["dep:html2md", "dep:scraper"]
file-tools = []
# calc is also in ollama-rs, but we need direct access for calculate tool
calc-tools = []
# scraper is also in ollama-rs, but we need direct access for finance tool
finance-tools = ["dep:scraper"]
system-tools = []
led-tools = []
# Skills system for on-demand skill loading
skills-tools = []
# Document import tool (TXT, MD, ORG, PDF, EPUB)
# PDF/EPUB require skills-tools feature for document-processing skill
document-tools = []
# Subagent tools (LLM-initiated subagent invocation for OCR, Vision, etc.)
subagent-tools = []
# Landlock sandbox for Linux (kernel 5.13+)
sandbox = ["dep:landlock"]
# Mermaid diagram rendering (Unicode box-drawing text, pure Rust)
mermaid = ["dep:mermaid-text"]
# LaTeX formula rendering (Unicode character art, pure Rust)
latex = ["dep:term-maths"]

[dependencies]
base64 = "0.22.1"
# calc is also a dependency of ollama-rs, but we use it directly for calculate tool
calc = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
dirs = "5.0"
futures = "0.3.31"
# html2md is also in ollama-rs, needed for search_builtin tool
html2md = { version = "0.2", optional = true }
indicatif = "0.17"
log = "0.4"
# ollama-rs brings: html2md, scraper (via tool-implementations)
ollama-rs = { version = "0.3.4", default-features = false, features = ["headers", "macros", "stream", "tokio", "tool-implementations", "rustls"] }
once_cell = "1.21"
# Use same reqwest version as ollama-rs to avoid duplication
# Use rustls-tls for cross-compilation support (no OpenSSL dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "system-proxy"] }
# rattles provides spinner animation presets (frames for ratatui widget and indicatif)
rattles = "0.2"
# regex is used directly in our code for file filtering
regex = "1.10"
# cli-clipboard provides cross-platform clipboard access (X11+Wayland+macOS+Windows)
# Not available on Android (Termux) — clipboard module uses no-op fallback
# crossterm provides terminal raw mode, events, and input for ratatui TUI
# bracketed-paste enables Event::Paste for terminal paste support
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
# ratatui provides the TUI framework for responsive chat rendering
ratatui = "0.30"
# ratatui-textarea provides a multi-line text editor widget for the TUI input
ratatui-textarea = "0.9.1"
# tui-markdown converts markdown to ratatui Text with syntax highlighting
tui-markdown = { version = "0.3", features = ["highlight-code"] }
# unicode-segmentation for grapheme-aware text editing in CrosstermInput
unicode-segmentation = "1.11"
# scraper is also in ollama-rs, needed for finance tool
scraper = { version = "0.22", optional = true }
# schemars is needed by the Tool trait for JSON schema generation
# (CustomToolInfo::new + the llm_provider ToolInfo family). Pinned to 1.x
# to match the version used by ollama-rs 0.3.4 (a transitive dependency
# that will be removed in #123).
schemars = "1"
# serde_derive is needed by the Tool trait (re-exported to derived Params structs)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
 serde_yaml = "0.9"
 tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
# toml_edit preserves comments and formatting when modifying TOML files.
# Used by `sprach config upgrade` to insert missing default fields
# into existing config.toml without disturbing user content.
toml_edit = "0.22"
urlencoding = "2.1"
walkdir = "2.5"
unicode-width = "0.2.2"
# Mermaid diagram rendering as Unicode box-drawing text (pure Rust, no browser)
# Optional — enabled by the "mermaid" feature flag
mermaid-text = { version = "0.56", optional = true }
# LaTeX formula rendering as Unicode character art (pure Rust, no C dependencies)
# Optional — enabled by the "latex" feature flag
term-maths = { version = "1.0", optional = true, features = ["ratatui"] }
# Database for semantic search
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
# External tool detection
which = "8.0"
# Shell-style command line parsing for run_command
shell-words = "1.1"
# Our proc-macro crate for #[sprachspiel::tool]
sprachspiel-tool-derive = { path = "sprachspiel-tool-derive", version = "0.1" }

# Platform-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
# Landlock sandbox for filesystem isolation (Linux kernel 5.13+)
landlock = { version = "0.4", optional = true }

# Dependencies excluded on Android (Termux) — clipboard uses no-op fallback
[target.'cfg(not(target_os = "android"))'.dependencies]
cli-clipboard = "0.4.0"

# Development dependencies
[dev-dependencies]
tempfile = "3"
serial_test = "3.2"


# Lint configuration — enforces code quality standards across CI and local dev.
# Individual #[allow(clippy::...)] must include a justification comment.
[lints.clippy]
too_many_arguments = "warn"
type_complexity = "warn"
enum_variant_names = "warn"
redundant_async_block = "warn"
missing_transmute_annotations = "allow"

# Harness engineering lints (from rust-magic-linter philosophy)
# Prefer #[expect] over #[allow] — #[expect] verifies the lint actually fires.
# #[allow] is acceptable when the lint doesn't fire in default builds
# (e.g., dead_code for TUI abstractions, unused_imports behind feature gates).
allow_attributes = "warn"
# Panic prevention — forces explicit error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "deny"
# Code hygiene — no debug leftovers or incomplete markers
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Complexity — prevent monstros functions
cognitive_complexity = "warn"
too_many_lines = "warn"
