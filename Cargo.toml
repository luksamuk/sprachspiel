[package]
name = "ask-ai"
version = "0.10.0"
edition = "2024"

[features]
default = ["weather-tools", "file-tools", "pokemon-tools", "calc-tools", "serper-tools", "system-tools"]
all-tools = ["pokemon-tools", "weather-tools", "search-tools", "file-tools", "calc-tools", "finance-tools", "serper-tools", "system-tools"]
pokemon-tools = []
weather-tools = []
search-tools = ["dep:html2md"]
serper-tools = []
file-tools = []
calc-tools = []
finance-tools = ["dep:scraper"]
system-tools = ["dep:chrono"]

[dependencies]
base64 = "0.22.1"
calc = "0.4"
chrono = { version = "0.4", optional = true }
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
dirs = "5.0"
futures = "0.3.31"
html2md = { version = "0.2", optional = true }
indicatif = "0.17"
ollama-rs = { version = "0.3.4", features = ["headers", "macros", "stream", "tokio", "tool-implementations"] }
once_cell = "1.21"
reqwest = { version = "0.13.2", features = ["json"] }
regex = "1.10"
scraper = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
termimad = "0.34"
tokio = "1.49.0"
toml = "0.8"
urlencoding = "2.1"
walkdir = "2.5"
