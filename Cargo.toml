[package]
name = "ask-ollama"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures = "0.3.31"
ollama-rs = { version = "0.3.3", features = ["headers", "macros", "stream", "tokio", "tool-implementations"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.49.0"
