# Clippy configuration for ask-ai
# Harness engineering: thresholds enforce quality without being overly strict.
# Reference: rust-magic-linter (vicnaum/rust-magic-linter)

# Maximum number of arguments before clippy warns.
# Current max: 8 (feedback_ops). Keep threshold at 7 to flag new violations
# that require explicit #[allow] with justification.
too-many-arguments-threshold = 7

# Maximum cognitive complexity per function.
# Lowered from 25 to 15 — functions exceeding this should be refactored.
# This catches complexity creep early.
cognitive-complexity-threshold = 15

# Maximum number of lines per type definition before clippy warns.
# Large types should be refactored or documented.
type-complexity-threshold = 250

# Maximum lines per function before clippy warns (too_many_lines lint).
# Functions over 100 lines are candidates for extraction.
too-many-lines-threshold = 100

# Allow certain words in doc comments without marking them as code.
doc-valid-idents = [
    "AskAI",
    "Ollama",
    "SQLite",
    "Vec0",
    "nomic-embed-text",
    "GGUF",
    "CPU",
    "GPU",
    "API",
    "CLI",
    "TUI",
    "REPL",
    "OCR",
    "HTTP",
    "HTTPS",
    "URL",
    "LLM",
    "NLI",
    "XDG",
    "MCP",
    "AST",
]