[package]
name = "sprachspiel-tool-derive"
version = "0.1.0"
edition = "2024"
description = "Proc-macro crate for sprachspiel's #[sprachspiel::tool] attribute"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
trybuild = "1"
tokio = { version = "1", features = ["rt", "macros"] }
